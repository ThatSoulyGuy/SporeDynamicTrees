modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# The mixins reference Spore and Dynamic Trees classes, so only apply them when both are present.
[[mixins]]
config = "sporedynamictrees.mixins.json"
requiredMods = ["spore", "dynamictrees"]

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "spore"
type = "required"
versionRange = "${spore_version_range}"
ordering = "NONE"
side = "BOTH"

# AFTER is required: Dynamic Trees loads every mod's tree packs (including our rotten family)
# in its own BLOCK RegisterEvent listener, which must run before our registry handler flushes.
[[dependencies."${mod_id}"]]
modId = "dynamictrees"
type = "required"
versionRange = "${dynamictrees_version_range}"
ordering = "AFTER"
side = "BOTH"
