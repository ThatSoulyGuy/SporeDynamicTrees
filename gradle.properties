# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Development NeoForge version.
neo_version=21.1.255
# Spore 2.2.0j requires NeoForge 21.1.212 or newer.
neo_version_range=[21.1.212,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Compatibility Targets
# The mixins (all required) and Dynamic Trees API calls were verified against Spore 2.2.0j and Dynamic Trees 1.7.2.
# A Spore build with different hook targets would crash at startup instead of showing NeoForge's dependency
# screen, so only widen these ranges after re-verifying the hooks.
spore_version_range=[2.2.0j]
dynamictrees_version_range=[1.7.2,1.8)

## Mod Properties
# Must match SporeDynamicTrees.MODID.
mod_id=sporedynamictrees
mod_name=SporeDynamicTrees
mod_license=GNU LGPL 3.0
mod_version=1.0.0
# The Gradle project group; matches the base package.
mod_group_id=com.thatsoulyguy
mod_authors=ThatSoulyGuy
mod_description=Spore x Dynamic Trees compatibility: the fungal infection rots whole Dynamic Trees into decayed branches, and Spore mobs no longer lift small branches.
